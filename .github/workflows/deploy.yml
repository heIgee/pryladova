name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE_REPO: pryladova-api

jobs:
  build-image:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Normalize GHCR owner
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "GHCR_OWNER=${owner}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=ghcr.io/${owner}/${{ env.IMAGE_REPO }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    needs: [build-image]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Normalize GHCR owner
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KNOWN_HOST: ${{ secrets.VPS_SSH_KNOWN_HOST }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY}" ] || [ -z "${VPS_HOST}" ] || [ -z "${VPS_SSH_KNOWN_HOST}" ]; then
            echo "VPS_SSH_KEY, VPS_HOST, and VPS_SSH_KNOWN_HOST secrets are required"
            exit 1
          fi
          USER_NAME="${VPS_USER:-ubuntu}"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOST" >> ~/.ssh/known_hosts
          SSH=(ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)
          SCP=(scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes)

          "${SSH[@]}" "${USER_NAME}@${VPS_HOST}" "mkdir -p ~/pryladova/web"
          "${SCP[@]}" docker-compose.yml "${USER_NAME}@${VPS_HOST}:~/pryladova/docker-compose.yml"
          "${SCP[@]}" -r apps/web/dist/. "${USER_NAME}@${VPS_HOST}:~/pryladova/web/"

          "${SSH[@]}" "${USER_NAME}@${VPS_HOST}" env \
            GHCR_USER="${GHCR_USER}" \
            GHCR_OWNER="${GHCR_OWNER}" \
            IMAGE_TAG="${IMAGE_TAG}" \
            GHCR_TOKEN="${GHCR_TOKEN}" \
            bash -s <<'REMOTE'
          set -euo pipefail
          cd ~/pryladova
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          unset GHCR_TOKEN
          FULL_IMAGE="ghcr.io/${GHCR_OWNER}/pryladova-api:${IMAGE_TAG}"
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
          else
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
          fi
          if ! docker image inspect "$FULL_IMAGE" >/dev/null 2>&1; then
            docker compose pull api
          else
            echo "Image ${FULL_IMAGE} already present — skipping pull"
          fi
          SENTRY_RELEASE="${IMAGE_TAG}" docker compose up -d
          docker logout ghcr.io
          docker image prune -f
          REMOTE
