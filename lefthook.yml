colors: false

output:
  - failure
  - execution_out

pre-commit:
  piped: true
  jobs:
    - name: biome
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,mts,cts,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm exec turbo run typecheck
